<header class="header">
  <div class="header__inner container">
    <a
      class="brand"
      routerLink="/"
      aria-label="Демонология — главная страница"
      (click)="closeMenu()"
    >
      <span class="brand__index">АРХИВ / 001</span>

      <span class="brand__name">
        Демонология
      </span>
    </a>

    <button
      class="menu-button"
      type="button"
      aria-controls="main-navigation"
      [class.menu-button--active]="menuOpen()"
      [attr.aria-expanded]="menuOpen()"
      [attr.aria-label]="menuOpen() ? 'Закрыть меню' : 'Открыть меню'"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
    </button>

    <nav
      id="main-navigation"
      class="navigation"
      [class.navigation--open]="menuOpen()"
      aria-label="Главная навигация"
    >
      <div class="navigation__mobile-label">
        <span>АРХИВНАЯ НАВИГАЦИЯ</span>
        <strong>Разделы проекта</strong>
      </div>

      <a
        routerLink="/encyclopedia"
        routerLinkActive="navigation__link--active"
        (click)="closeMenu()"
      >
        <span>01</span>
        Энциклопедия
      </a>

      <a
        routerLink="/gallery"
        routerLinkActive="navigation__link--active"
        (click)="closeMenu()"
      >
        <span>02</span>
        Галерея
      </a>

      <a
        routerLink="/glossary"
        routerLinkActive="navigation__link--active"
        (click)="closeMenu()"
      >
        <span>03</span>
        Словарь
      </a>

      <a
        routerLink="/blog"
        routerLinkActive="navigation__link--active"
        (click)="closeMenu()"
      >
        <span>04</span>
        Исследования
      </a>

      <a
        routerLink="/about"
        routerLinkActive="navigation__link--active"
        (click)="closeMenu()"
      >
        <span>05</span>
        О проекте
      </a>

      <div class="navigation__mobile-footer">
        МИФОЛОГИЯ / ФОЛЬКЛОР / ВИЗУАЛЬНАЯ КУЛЬТУРА
      </div>
    </nav>

    <button
      class="navigation-backdrop"
      type="button"
      [class.navigation-backdrop--visible]="menuOpen()"
      [attr.aria-hidden]="!menuOpen()"
      tabindex="-1"
      aria-label="Закрыть меню"
      (click)="closeMenu()"
    ></button>

    <img
      class="header__sigil"
      src="assets/decor/sigil.svg"
      alt=""
      aria-hidden="true"
    />
  </div>
</header>
